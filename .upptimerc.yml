# Change these two lines to your GitHub username and repository name:
owner: TheNomicFellow
repo: streamico-status

sites:
  - name: Streamico Web (Frontend)
    url: https://streamico.vercel.app
    icon: https://streamico.vercel.app/logo.png

  - name: Streamico API & Database
    url: https://streamico.vercel.app/api/health
    expectedStatusCodes:
      - 200

status-website:
  # Title displayed on your public status page
  name: Streamico Status
  introTitle: "Streamico Platform Status"
  introMessage: "Real-time status monitoring for Streamico web application and backend API."
  theme: dark
  # Optional: if you have a custom domain (e.g. status.streamico.app):
  # cname: status.streamico.app

